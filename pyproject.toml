[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trialtrace"
version = "0.1.1"
description = "A source-linked explorer for a frozen, derived ClinicalTrials.gov history corpus"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Byungwoong Yoo" },
]
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
test = [
  "httpx2==2.12.0",
  "pytest==9.1.1",
]
dev = [
  "bandit==1.9.4",
  "pip-audit==2.10.1",
  "ruff==0.16.7",
]

[project.urls]
Repository = "https://github.com/ByungwoongYoo/trialtrace"
Issues = "https://github.com/ByungwoongYoo/trialtrace/issues"
Archive = "https://doi.org/10.5281/zenodo.22162352"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trialtrace = ["static/*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["trialtrace"]
branch = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
