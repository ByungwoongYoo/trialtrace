name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip==26.2.1 setuptools==84.0.0
          python -m pip install -e ".[test,dev]"
          python -m pip check
      - name: Build distributions
        run: python -m build
      - name: Test installed wheel
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --upgrade pip==26.2.1
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/python scripts/smoke_installed_wheel.py
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Security static analysis
        run: bandit -r src scripts -ll
      - name: Dependency vulnerability audit
        run: pip-audit --skip-editable
      - name: Build frozen database
        run: python scripts/build_db.py
      - name: Test
        run: |
          coverage run -m pytest
          coverage report --show-missing --fail-under=80
          coverage json -o coverage.json
          python scripts/check_branch_coverage.py coverage.json --minimum 80
