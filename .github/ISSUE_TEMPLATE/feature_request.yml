name: Feature request
description: Propose a bounded improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the recurring problem this change would solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: data_security
    attributes:
      label: Data, license, and security effect
      description: Identify new inputs, outputs, dependencies, source data, or trust boundaries.
    validations:
      required: true
